<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | GITTS-Education</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">GITTS<span>-EDUCATION</span> ADMIN</a><nav><a href="#" id="logout">Logout</a></nav></header><main class="dash"><p class="eyebrow">PRIVATE ADMINISTRATION</p><h1>Admin dashboard</h1><div id="metrics" class="cards"></div><section class="panel" style="margin-top:20px"><h2>Members</h2><input id="q" placeholder="Search members by name, email, phone or referral code"><div id="users"></div></section><section class="panel" style="margin-top:20px"><h2>Upload an e-book</h2><form id="bookForm" enctype="multipart/form-data"><label>Title</label><input name="title" required><label>Description</label><textarea name="description"></textarea><label>Category</label><input name="category"><label>Price (KSh)</label><input name="price" type="number" min="1" required><label>PDF</label><input name="pdf" type="file" accept="application/pdf" required><label>Cover image (optional)</label><input name="cover" type="file" accept="image/*"><button class="btn">Upload book</button></form><div id="books"></div></section><section class="panel" style="margin-top:20px"><h2>Withdrawal requests</h2><div id="withdrawals"></div></section><section class="panel" style="margin-top:20px"><h2>Payments</h2><div id="payments"></div></section></main><script>
const api=async (url,opts={})=>{const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d};
async function init(){try{const o=await api("/api/admin/overview");document.querySelector("#metrics").innerHTML=Object.entries(o).map(([k,v])=>`<div class="metric"><strong>${v}</strong><span>${k}</span></div>`).join("");await users();const b=await api("/api/admin/books");document.querySelector("#books").innerHTML=b.map(x=>`<p>${x.title} — KSh ${x.price} <button onclick="editBook('${x._id}',${x.price})">Change price</button> <button onclick="deactivateBook('${x._id}')">Deactivate</button></p>`).join("");const w=await api("/api/admin/withdrawals");document.querySelector("#withdrawals").innerHTML=w.map(x=>`<p>${x.user?.name||"Member"} · KSh ${x.amount} · ${x.status} · ${x.phone} <button onclick="withdrawAction('${x._id}','approved')">Approve</button> <button onclick="withdrawAction('${x._id}','rejected')">Reject</button> <button onclick="markPaid('${x._id}')">Mark paid</button></p>`).join("");const p=await api("/api/admin/payments");document.querySelector("#payments").innerHTML=p.map(x=>`<p>${x.user?.name||"Member"} · ${x.kind} · KSh ${x.amount} · ${x.status} · ${x.receipt||""}</p>`).join("")}catch(e){alert(e.message);location.href="/login.html"}}
async function users(){const u=await api("/api/admin/users?q="+encodeURIComponent(document.querySelector("#q").value));document.querySelector("#users").innerHTML="<table class='table'><tr><th>Name</th><th>Phone</th><th>County / Town</th><th>Status</th><th>Action</th></tr>"+u.map(x=>`<tr><td>${x.name}<br>${x.email}</td><td>${x.phone}</td><td>${x.county||""} / ${x.town||""}</td><td>${x.status}</td><td><button onclick="status('${x._id}','${x.status==="suspended"?"active":"suspended"}')">${x.status==="suspended"?"Activate":"Suspend"}</button></td></tr>`).join("")+"</table>"}
document.querySelector("#q").oninput=users;
document.querySelector("#bookForm").onsubmit=async e=>{e.preventDefault();try{const r=await fetch("/api/admin/books",{method:"POST",body:new FormData(e.target)});const d=await r.json();if(!r.ok)throw Error(d.error);alert("Book uploaded");e.target.reset();init()}catch(x){alert(x.message)}};
window.status=async(id,status)=>{await api(`/api/admin/users/${id}/status`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});users()};
window.editBook=async(id,old)=>{const price=prompt("New price (KSh)",old);if(price===null)return;await api(`/api/admin/books/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({price:Number(price)})});init()};
window.deactivateBook=async id=>{await api(`/api/admin/books/${id}`,{method:"DELETE"});init()};
window.withdrawAction=async(id,status)=>{await api(`/api/admin/withdrawals/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});init()};
window.markPaid=async id=>{const mpesaReceipt=prompt("Enter M-Pesa receipt/reference after sending payment:");if(!mpesaReceipt)return;await api(`/api/admin/withdrawals/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:"paid",mpesaReceipt})});init()};
document.querySelector("#logout").onclick=async e=>{e.preventDefault();await fetch("/api/auth/logout",{method:"POST"});location.href="/"};init();
</script></body></html>
