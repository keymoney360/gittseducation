<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | GITTS-Education</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-wrap"><form class="form-card" id="register"><a class="brand" href="/">GITTS<span>-EDUCATION</span></a><h1>Create your account</h1><p class="muted">Membership registration fee: KSh 300. An M-Pesa prompt will be sent after you submit.</p><label>Full name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Phone number</label><input name="phone" placeholder="07XXXXXXXX" required><label>Password (minimum 10 characters)</label><input name="password" type="password" minlength="6" required><label>Referral code (optional)</label><input name="referralCode" id="referralCode"><label>County</label><input name="county"><label>Town</label><input name="town"><button class="btn">Register & pay KSh 300</button><p id="msg" class="notice hidden"></p><p class="muted">Already registered? <a href="/login.html">Log in</a></p></form></main><script>
const params=new URLSearchParams(location.search);document.querySelector("#referralCode").value=params.get("ref")||"";
document.querySelector("#register").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(f)});const d=await r.json();const m=document.querySelector("#msg");m.classList.remove("hidden");m.textContent=d.error||d.message;};
</script></body></html>
