<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-wrap"><form class="form-card" id="f"><h1>Choose a new password</h1><label>New password</label><input name="password" type="password" minlength="10" required><button class="btn">Update password</button><p id="msg" class="notice hidden"></p></form></main><script>document.querySelector("#f").onsubmit=async e=>{e.preventDefault();const p=new URLSearchParams(location.search);const body={email:p.get("email"),token:p.get("token"),password:new FormData(e.target).get("password")};const r=await fetch("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();const m=document.querySelector("#msg");m.classList.remove("hidden");m.textContent=d.message||d.error;};</script></body></html>
