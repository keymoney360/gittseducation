<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-wrap"><form class="form-card" id="f"><h1>Reset password</h1><p class="muted">Enter your account email. If it exists, we will send a secure reset link.</p><label>Email</label><input name="email" type="email" required><button class="btn">Send reset link</button><p id="msg" class="notice hidden"></p></form></main><script>document.querySelector("#f").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();const m=document.querySelector("#msg");m.classList.remove("hidden");m.textContent=d.message||d.error;};</script></body></html>
