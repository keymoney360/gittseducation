<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | GITTS-Education</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-wrap"><form class="form-card" id="login"><a class="brand" href="/">GITTS<span>-EDUCATION</span></a><h1>Welcome back</h1><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn">Log in</button><p id="msg" class="notice hidden"></p><p><a href="/forgot-password.html">Forgot password?</a></p></form></main><script>document.querySelector("#login").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(f)});const d=await r.json();if(r.ok)location.href=d.user.role==="admin"?"/admin.html":"/dashboard.html";else{const m=document.querySelector("#msg");m.classList.remove("hidden");m.textContent=d.error;}};</script></body></html>
