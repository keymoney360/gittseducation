<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | GITTS</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><a class="brand" href="/">GITTS<span>-EDUCATION</span></a><nav><a href="/">Shop</a><a href="#" id="logout">Logout</a></nav></header><main class="dash"><p class="eyebrow">MEMBER AREA</p><h1 id="hello">Your dashboard</h1><div class="cards" id="metrics"></div><section class="panel" style="margin-top:20px"><h2>Your referral link</h2><div class="row"><input id="refLink" readonly><button class="btn" id="copy">Copy link</button></div></section><section class="panel" style="margin-top:20px"><h2>Request a withdrawal</h2><form id="withdraw" class="row"><input name="phone" placeholder="M-Pesa phone number" required><input name="amount" type="number" min="100" placeholder="Amount (KSh)" required><button class="btn">Submit request</button></form><p id="msg" class="muted"></p></section><section class="panel" style="margin-top:20px"><h2>Recent referrals & commissions</h2><div id="commissions" class="muted">Loading...</div></section><section class="panel" style="margin-top:20px"><h2>My orders</h2><div id="orders" class="muted">Loading...</div></section></main><script>
async function load(){const r=await fetch("/api/dashboard");if(!r.ok){location.href="/login.html";return}const d=await r.json();document.querySelector("#hello").textContent=`Welcome, ${d.user.name}`;document.querySelector("#refLink").value=d.user.referralLink;document.querySelector("#metrics").innerHTML=[["Direct referrals",d.referrals.direct],["Second level",d.referrals.secondLevel],["Total earnings",`KSh ${d.earnings.total}`],["Available balance",`KSh ${d.earnings.available}`],["Pending withdrawals",`KSh ${d.earnings.pending}`],["Withdrawn",`KSh ${d.earnings.withdrawn}`]].map(x=>`<div class="metric"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join("");document.querySelector("#commissions").innerHTML=d.commissions.length?d.commissions.map(c=>`<p>Level ${c.level} · KSh ${c.amount} · ${c.sourceUser?.name||"Referral"}</p>`).join(""):"No commissions yet.";document.querySelector("#orders").textContent=d.orders.length?d.orders.map(o=>`${o.status} — KSh ${o.total}`).join(" | "):"No orders yet."}
document.querySelector("#copy").onclick=()=>navigator.clipboard.writeText(document.querySelector("#refLink").value);
document.querySelector("#withdraw").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/withdrawals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();document.querySelector("#msg").textContent=d.message||d.error;load()};
document.querySelector("#logout").onclick=async e=>{e.preventDefault();await fetch("/api/auth/logout",{method:"POST"});location.href="/"};load();
</script></body></html>
